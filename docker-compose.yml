version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelflow_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:sentinel_pass@db:5432/sentinelflow
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=production-sentinelflow-random-entropy-key-replace-me
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinelflow_net

  db:
    image: postgres:16-alpine
    container_name: sentinelflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_pass
      POSTGRES_DB: sentinelflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_user -d sentinelflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelflow_net

  redis:
    image: redis:7-alpine
    container_name: sentinelflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelflow_net

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: sentinelflow_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - sentinelflow_net

volumes:
  postgres_data:
  redis_data:

networks:
  sentinelflow_net:
    driver: bridge

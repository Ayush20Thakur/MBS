apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelflow-ingress
  namespace: sentinelflow
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: api.sentinelflow.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinelflow-api
                port:
                  number: 80

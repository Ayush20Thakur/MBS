apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelflow-network-policy
  namespace: sentinelflow
spec:
  podSelector:
    matchLabels:
      app: sentinelflow-api
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000

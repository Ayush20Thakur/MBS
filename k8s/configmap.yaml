apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelflow-config
  namespace: sentinelflow
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  PORT: "8000"
  VELOCITY_WINDOW_SECONDS: "60"
  VELOCITY_MAX_TRANSACTIONS: "5"
  MAX_SINGLE_TRANSACTION_LIMIT: "50000.00"
  FRAUD_RISK_THRESHOLD: "0.75"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "120"
